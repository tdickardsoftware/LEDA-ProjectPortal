server {
    listen 80;
    server_name portal.demo.lakeeriedarts.com;

    # Allow Certbot ACME challenges through HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Temporarily serve app over HTTP until we get SSL cert
    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

    # ── Internal auth-check (called by auth_request, never hit directly) ───────
    location = /_internal/auth-check {
        internal;
        proxy_pass              http://app:3000/api/internal/auth-check;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
        # Forward cookies so Better-Auth can read the session
        proxy_set_header        Cookie $http_cookie;
    }

    # ── Grafana — Developer role required ────────────────────────────────────
    location /monitoring/grafana/ {
        auth_request      /_internal/auth-check;
        # On 401 redirect to login; on 403 redirect to portal
        error_page 401 =302 /login;
        error_page 403 =302 /Portal;

        proxy_pass         http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Tell Grafana its sub-path
        proxy_set_header   X-Forwarded-Prefix /monitoring/grafana;
    }

    # ── Dozzle — Developer role required ─────────────────────────────────────
    location /monitoring/dozzle/ {
        auth_request      /_internal/auth-check;
        error_page 401 =302 /login;
        error_page 403 =302 /Portal;

        proxy_pass         http://dozzle:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
