server {
    listen 80;
    server_name portal.demo.lakeeriedarts.com;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Allow Certbot ACME challenges through HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name portal.demo.lakeeriedarts.com;

    ssl_certificate     /etc/letsencrypt/live/portal.demo.lakeeriedarts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.demo.lakeeriedarts.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Proxy to Next.js app
    location / {
        proxy_pass             http://app:3000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection 'upgrade';
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_cache_bypass     $http_upgrade;
        # Prevent indefinite hangs if the app is unresponsive
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }

    # ── Internal auth-check (called by auth_request, never hit directly) ───────
    location = /_internal/auth-check {
        internal;
        proxy_pass              http://app:3000/api/internal/auth-check;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
        # Forward cookies so Better-Auth can read the session
        proxy_set_header        Cookie $http_cookie;
    }

    # ── Grafana — Developer role required ────────────────────────────────────
    location /monitoring/grafana/ {
        auth_request      /_internal/auth-check;
        # On 401 redirect to login (preserving the destination); on 403 redirect to portal
        error_page 401 =302 /login?redirect=$request_uri;
        error_page 403 =302 /Portal;

        proxy_pass         http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Tell Grafana its sub-path
        proxy_set_header   X-Forwarded-Prefix /monitoring/grafana;
    }

    # ── Dozzle — Developer role required ─────────────────────────────────────
    location /monitoring/dozzle/ {
        auth_request      /_internal/auth-check;
        # On 401 redirect to login (preserving the destination); on 403 redirect to portal
        error_page 401 =302 /login?redirect=$request_uri;
        error_page 403 =302 /Portal;

        proxy_pass         http://dozzle:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
