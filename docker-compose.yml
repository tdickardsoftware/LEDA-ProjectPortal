
services:
  postgres:
    image: postgres:16-alpine
    tty: true
    stdin_open: true
    ports:
      - 5432:5432
    volumes:
      - ~/apps/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=admin
      - POSTGRES_DB=leda_db
  
  nextjs:
    build:
      context: ./leda_project_portal
      dockerfile: Dockerfile
    ports: 
      - "3000:3000"
    depends_on:
      - postgres